name: Bump cask
on:
  workflow_dispatch:
    inputs:
      cask:
        description: The token of the cask to bump
        required: true
        type: string
      version:
        description: The new version for the cask
        required: true
        type: string
      url:
        description: The url for the new download
        type: string
      sha256:
        description: The SHA-256 checksum of the new download
        type: string

jobs:
  bump-cask:
    name: Bump cask
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.19.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@2026.10.19.1

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - name: Bump cask version
        env:
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          CASK: ${{ inputs.cask }}
          VERSION: ${{ inputs.version }}
          URL_OPTION: ${{ case(inputs.url != '', format('--url ''{0}''', inputs.url), '') }}
          SHA256_OPTION: ${{ case(inputs.sha256 != '', format('--sha256 ''{0}''', inputs.sha256), '') }}
        run: |
          # shellcheck disable=SC2086
          brew bump-cask-pr -d --write-only --no-audit --version "$VERSION" $URL_OPTION $SHA256_OPTION $CASK

      - name: Commit and push
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          repo: ${{ github.repository }}
          branch: main
          commit_message: ${{ inputs.cask }} ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
